name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example: v0.9.0)"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create tag and GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release target
        id: validate
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run releases from the main branch."
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use the vMAJOR.MINOR.PATCH format."
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" != "v${package_version}" ]]; then
            echo "::error::Requested ${VERSION}, but package.json contains ${package_version}."
            exit 1
          fi

          release_notes_file="docs/releases/${VERSION}.md"
          if [[ ! -s "$release_notes_file" ]]; then
            echo "::error::Release notes are required at ${release_notes_file}."
            exit 1
          fi

          git fetch origin main --tags
          remote_main="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$remote_main" ]]; then
            echo "::error::The selected commit is not the latest origin/main commit."
            exit 1
          fi

          tag_exists=false
          if git show-ref --verify --quiet "refs/tags/${VERSION}"; then
            tag_commit="$(git rev-list -n 1 "$VERSION")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag ${VERSION} points to ${tag_commit}, not ${GITHUB_SHA}."
              exit 1
            fi
            tag_exists=true
          fi

          release_exists=false
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
          fi

          echo "tag_exists=${tag_exists}" >> "$GITHUB_OUTPUT"
          echo "release_exists=${release_exists}" >> "$GITHUB_OUTPUT"
          echo "release_notes_file=${release_notes_file}" >> "$GITHUB_OUTPUT"

      - name: Confirm CI success for this commit
        if: steps.validate.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api_path="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=1"
          for attempt in {1..40}; do
            status="$(gh api "$api_path" --jq '.workflow_runs[0].status // "missing"')"
            conclusion="$(gh api "$api_path" --jq '.workflow_runs[0].conclusion // "pending"')"

            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" != "success" ]]; then
                echo "::error::CI completed with conclusion: ${conclusion}."
                exit 1
              fi
              echo "CI succeeded for ${GITHUB_SHA}."
              exit 0
            fi

            echo "CI status is ${status}; waiting (${attempt}/40)."
            sleep 15
          done

          echo "::error::CI did not complete successfully within 10 minutes."
          exit 1

      - name: Create annotated tag
        if: steps.validate.outputs.tag_exists != 'true' && steps.validate.outputs.release_exists != 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" "$GITHUB_SHA" -m "kosu $VERSION"
          git push origin "$VERSION"

      - name: Publish GitHub Release
        if: steps.validate.outputs.release_exists != 'true'
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_FILE: ${{ steps.validate.outputs.release_notes_file }}
        run: |
          set -euo pipefail
          release_notes="$(cat "$RELEASE_NOTES_FILE")"
          release_url="$(gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "kosu $VERSION" \
            --notes "$release_notes" \
            --generate-notes \
            --latest)"
          echo "Published ${release_url}"
          echo "## ${VERSION} published" >> "$GITHUB_STEP_SUMMARY"
          echo "${release_url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Report existing GitHub Release
        if: steps.validate.outputs.release_exists == 'true'
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          release_url="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          echo "${VERSION} is already published at ${release_url}"
          echo "## ${VERSION} already published" >> "$GITHUB_STEP_SUMMARY"
          echo "${release_url}" >> "$GITHUB_STEP_SUMMARY"

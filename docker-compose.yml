services:
  kosu:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - KOSU_SESSION_SECRET=${KOSU_SESSION_SECRET}
      - KOSU_DATA_DIR=/data
    volumes:
      - kosu-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  kosu-data:
